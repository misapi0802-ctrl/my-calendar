<!doctype html><html lang="ja"><head><link rel="icon" type="image/png" href="icon.png"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#D9B6BD"><title>My Calendar ♡</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#493c42;background:#fff9fa}*{box-sizing:border-box}body{margin:0}main{max-width:650px;margin:auto;padding:18px 12px 50px}h1{font-size:23px;margin:4px 0}small{color:#82727a}.panel{background:white;border:1px solid #f0dfe4;border-radius:18px;padding:14px;box-shadow:0 4px 20px #c99eaa18}.head,.toolbar,.event{display:flex;align-items:center;justify-content:space-between;gap:8px}.toolbar{margin:12px 0}button{border:0;background:#d9b6bd;color:#34252a;border-radius:10px;padding:10px 13px;font-weight:650;cursor:pointer}button.secondary{background:#f4e7eb;color:#5d4650}button:active{opacity:.75}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.week{text-align:center;font-size:12px;color:#8c7980;margin:8px 0}.day{min-height:78px;padding:4px 2px;border:1px solid transparent;border-radius:7px;background:#fbf5f7;text-align:left;overflow:hidden;cursor:pointer}.day.selected{background:#f4e2e6;border-color:#d9b6bd}.day.today .num{text-decoration:underline}.num{font-size:12px;margin-bottom:4px}.item{display:flex;align-items:flex-start;gap:3px;font-size:9px;line-height:1.25;margin-bottom:3px;overflow-wrap:anywhere}.dot{display:inline-block;flex-shrink:0;width:6px;height:6px;border-radius:50%;margin-top:2px}.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;margin-top:12px}.legend span{display:flex;align-items:center;gap:4px}.section{margin-top:20px}.event{padding:11px 0;border-bottom:1px solid #f1e7e9}.event .detail{flex:1;min-width:0}.event .detail strong{display:block;overflow-wrap:anywhere}.event small{display:block}.event button{padding:7px 9px;font-size:12px}form{margin-top:12px;padding:14px;background:#fcf3f6;border-radius:12px}label{display:block;font-size:12px;font-weight:600;margin:10px 0 4px}input,select{width:100%;border:1px solid #e5cdd4;background:white;border-radius:9px;padding:12px;font-size:16px;color:#493c42}.check{display:flex;align-items:center;gap:8px;margin-top:12px}.check input{width:auto}.actions{display:flex;gap:8px;margin-top:14px}.actions button{flex:1}.hidden{display:none}.hint{font-size:12px;color:#85747b;line-height:1.6;margin-top:16px}</style></head><body><main><div class="panel"><div class="head"><div><small>My Calendar ♡</small><h1 id="monthTitle"></h1></div><div><button class="secondary" id="prev" aria-label="前月">‹</button> <button class="secondary" id="next" aria-label="翌月">›</button></div></div><div class="week"><span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span></div><div class="calendar" id="calendar"></div><div class="legend" id="legend"></div><div class="section"><div class="head"><div><small id="dateTitle"></small><h3 style="margin:3px 0">この日の予定</h3></div><button id="add">＋ 追加</button></div><div id="events"></div><form id="form" class="hidden"><h3 id="formTitle" style="margin:0">予定を追加</h3><label for="name">予定の名前</label><input id="name" maxlength="100" required placeholder="例：お休み、出勤"><label class="check"><input type="checkbox" id="allDay" checked> 時間を指定しない</label><div id="timeWrap" class="hidden"><label for="time">開始時間</label><input type="time" id="time" value="09:00"><label class="check"><input type="checkbox" id="hasEnd"> 終了時間も入力する</label><div id="endWrap" class="hidden"><label for="endTime">終了時間</label><input type="time" id="endTime" value="10:00"></div></div><label for="category">種類</label><select id="category"><option value="work">仕事</option><option value="personal">私用</option><option value="lulumii">ルルミィ</option><option value="other">その他</option></select><div class="actions"><button type="button" class="secondary" id="cancel">キャンセル</button><button type="submit">保存する ♡</button></div></form></div></div><p class="hint">予定はこのブラウザ内に保存されます。ブラウザのデータを削除すると予定も消えるため、大切な予定の唯一の保管先にはしないでね。ホーム画面の常時表示ウィジェットと通知は未対応です。</p></main><script>
const categories={work:['仕事','#82A6C7'],personal:['私用','#D9B6BD'],lulumii:['ルルミィ','#B69ACB'],other:['その他','#A4B89D']};const now=new Date();let year=now.getFullYear(),month=now.getMonth(),selected=now.getDate(),editing=null;const storageKey='my-calendar-v1';let events=[];try{const saved=JSON.parse(localStorage.getItem(storageKey)||'[]');if(Array.isArray(saved))events=saved}catch{}const $=id=>document.getElementById(id);const pad=n=>String(n).padStart(2,'0');const dateKey=d=>`${year}-${pad(month+1)}-${pad(d)}`;const save=()=>{try{localStorage.setItem(storageKey,JSON.stringify(events))}catch{alert('保存できませんでした。ブラウザの保存設定を確認してください。')}};function render(){ $('monthTitle').textContent=`${year}年 ${month+1}月`;const cal=$('calendar');cal.replaceChildren();const start=new Date(year,month,1).getDay(),days=new Date(year,month+1,0).getDate();for(let i=0;i<Math.ceil((start+days)/7)*7;i++){const d=i-start+1;const cell=document.createElement('div');if(d<1||d>days){cal.append(cell);continue}cell.className='day'+(d===selected?' selected':'')+(year===now.getFullYear()&&month===now.getMonth()&&d===now.getDate()?' today':'');cell.setAttribute('role','button');cell.tabIndex=0;const num=document.createElement('div');num.className='num';num.textContent=d;cell.append(num);const items=events.filter(e=>e.date===dateKey(d)).sort(sortEvents);for(const e of items.slice(0,2)){const line=document.createElement('div');line.className='item';const dot=document.createElement('span');dot.className='dot';dot.style.background=categories[e.category]?.[1]||categories.other[1];const txt=document.createElement('span');txt.textContent=e.name;line.append(dot,txt);cell.append(line)}if(items.length>2){const more=document.createElement('div');more.className='item';more.textContent=`＋${items.length-2}件`;cell.append(more)}const choose=()=>{selected=d;closeForm();render()};cell.onclick=choose;cell.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();choose()}};cal.append(cell)}$('legend').replaceChildren();for(const [key,[label,color]] of Object.entries(categories)){const span=document.createElement('span'),dot=document.createElement('i');dot.className='dot';dot.style.background=color;span.append(dot,document.createTextNode(label));$('legend').append(span)}$('dateTitle').textContent=`${year}年${month+1}月${selected}日`;$('events').replaceChildren();const dayEvents=events.filter(e=>e.date===dateKey(selected)).sort(sortEvents);if(!dayEvents.length){const empty=document.createElement('p');empty.textContent='この日はまだ予定がないよ ♡';empty.style.color='#82727a';$('events').append(empty)}for(const e of dayEvents){const row=document.createElement('div');row.className='event';const dot=document.createElement('i');dot.className='dot';dot.style.background=categories[e.category]?.[1]||categories.other[1];dot.style.width='10px';dot.style.height='10px';const detail=document.createElement('div');detail.className='detail';const title=document.createElement('strong');title.textContent=(e.time?e.time+(e.endTime?'〜'+e.endTime:'')+'　':'')+e.name;const sub=document.createElement('small');sub.textContent=categories[e.category]?.[0]||'その他';detail.append(title,sub);const edit=document.createElement('button');edit.className='secondary';edit.textContent='編集';edit.onclick=()=>openForm(e);const del=document.createElement('button');del.className='secondary';del.textContent='削除';del.onclick=()=>{if(confirm('この予定を削除しますか？')){events=events.filter(x=>x.id!==e.id);save();render()}};row.append(dot,detail,edit,del);$('events').append(row)}}function sortEvents(a,b){return (a.time||'').localeCompare(b.time||'')||a.name.localeCompare(b.name,'ja')}function closeForm(){$('form').classList.add('hidden');editing=null}function openForm(e=null){editing=e?.id??null;$('formTitle').textContent=e?'予定を編集':'予定を追加';$('name').value=e?.name||'';$('allDay').checked=!e?.time;$('time').value=e?.time||'09:00';$('hasEnd').checked=!!e?.endTime;$('endTime').value=e?.endTime||'10:00';$('category').value=e?.category||'personal';toggleTime();$('form').classList.remove('hidden');$('name').focus()}function toggleTime(){$('timeWrap').classList.toggle('hidden',$('allDay').checked);toggleEnd()}function toggleEnd(){$('endWrap').classList.toggle('hidden',$('allDay').checked||!$('hasEnd').checked)}$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);function move(n){const d=new Date(year,month+n,1);year=d.getFullYear();month=d.getMonth();selected=1;closeForm();render()}$('add').onclick=()=>openForm();$('cancel').onclick=closeForm;$('allDay').onchange=toggleTime;$('hasEnd').onchange=toggleEnd;$('form').onsubmit=e=>{e.preventDefault();const name=$('name').value.trim();if(!name)return;const start=$('allDay').checked?null:$('time').value;const end=start&&$('hasEnd').checked?$('endTime').value:null;if(end&&end<=start){alert('終了時間は開始時間より後にしてね。');return}const existing=events.find(x=>x.id===editing);const item={id:existing?.id||`${Date.now()}-${Math.random().toString(36).slice(2)}`,date:existing?.date||dateKey(selected),name,time:start,endTime:end,category:$('category').value};events=existing?events.map(x=>x.id===editing?item:x):[...events,item];save();closeForm();render()};render();
</script></body></html>
